# Same structure as _data/links.yml — same instructions for editing in that file too.

# Each top-level item is a category shown as a heading on /links/.
# Add a new link by copying an "items" block and filling in the three fields.
# Add a new category by copying a whole "- category: ..." block.
#
# Indentation matters in YAML — copy-pasting an existing block and editing
# the text is much safer than typing a new one from scratch.

- category: "Source document: Word"
  items:
    - title: Short Guide to Writing Maths in Words
      url: /materials/uoa_short_guides/MathsInWord.pptx

- category: "Source document: Powerpoint"
  items:
    - title: Some title
      url: https://example.com
      description: Delete this placeholder once you have a real link to add.


- category: "Source document: LaTeX (including Beamer)"
  items:
    - title: Accessibility for LaTeX users
      url: https://abdn.site/accessible-material-written-in-latex
    - title: Guide to Using LaTeXML
      url: /materials/latex/QU54_LaTeXML.pdf
    

- category: "Source document: Handwritten"
  items:
    - title: Short Guide to Handwritten Maths
      url: /materials/uoa_short_guides/HandwrittenMaths.pptx
     


- category: "Templates: including Quarto"
